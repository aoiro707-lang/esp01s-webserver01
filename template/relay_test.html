<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ESP01S Control</title>
</head>
<body>

<h2>ESP01S CONTROL PANEL</h2>

<p id="wifi">WiFi: Đang kiểm tra...</p>
<p id="relay">Relay: ...</p>

<button onclick="setRelay('ON')">ON</button>
<button onclick="setRelay('OFF')">OFF</button>

<script>
const SERVER = "https://esp01-server.onrender.com";

function updateStatus() {
  fetch(SERVER + "/status?t=" + Date.now()) // 🔴 chống cache
    .then(res => res.json())
    .then(data => {
      document.getElementById("wifi").innerText =
        data.online
          ? "WiFi: Đã kết nối (" + data.wifi + ")"
          : "WiFi: Chưa kết nối";

      document.getElementById("relay").innerText =
        "Relay: " + data.state;
    })
    .catch(() => {
      document.getElementById("wifi").innerText = "WiFi: Lỗi kết nối server";
    });
}

function setRelay(state) {
  fetch(SERVER + "/relay?state=" + state + "&t=" + Date.now())
    .then(() => updateStatus());
}

setInterval(updateStatus, 2000);
updateStatus();
</script>

</body>
</html>
